networks:
  bankapp-net:
    driver: bridge

volumes:
  mysql-data:
  ollama-data:

services:
  # ---------- MySQL ----------
  bankapp-mysql:
    image: mysql:8.0
    container_name: bankapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # Must be set
      MYSQL_DATABASE: ${MYSQL_DATABASE}             # Must be set
      MYSQL_USER: ${MYSQL_USER}                     # Must be set
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}             # Must be set
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bankapp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Ollama (AI Engine) ----------
  bankapp-ollama:
    image: ollama/ollama:0.6.2
    container_name: bankapp-ollama
    restart: always
    ports:
      - "11434:11434"   # Optional – remove if you only call from inside the network
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - bankapp-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------- Model Pull (one-time) ----------
  ollama-pull-model:
    image: ollama/ollama:0.6.2
    container_name: ollama-pull-model
    depends_on:
      bankapp-ollama:
        condition: service_healthy
    networks:
      - bankapp-net
    entrypoint: /bin/sh
    command: >
      -c "
        if ! ollama list | grep -q llama3; then
          ollama pull llama3
        fi
      "
    restart: "no"   # Run once and exit

  # ---------- Spring Boot Application (local build) ----------
  bankapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: bankapp:local   # Local tag for development
    container_name: bankapp
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://bankapp-mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      OLLAMA_BASE_URL: http://bankapp-ollama:11434
    depends_on:
      bankapp-mysql:
        condition: service_healthy
      bankapp-ollama:
        condition: service_healthy
    networks:
      - bankapp-net
    # user: "1000:1000"   # Uncomment if your Dockerfile doesn't switch user