# Production override for app-tier
# docker compose -f docker-compose.yml -f app-tier.yml up -d

services:
  bankapp-mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  bankapp:
    build: !reset null
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}   # Pull from ECR instead of building
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://bankapp-mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_URL}   # External AI EC2
    depends_on:
      bankapp-mysql:
        condition: service_healthy