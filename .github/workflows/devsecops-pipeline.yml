# =============================================================================
# DevSecOps Master Pipeline
# =============================================================================
# 9 sequential security gates before code reaches production:
#   1. Secret Scan       — Gitleaks
#   2. Lint              — Checkstyle
#   3. SAST              — Semgrep
#   4. SCA               — OWASP Dependency Check (cached)
#   5. Build             — Maven
#   6. Container Scan    — Trivy
#   7. Push              — Amazon ECR (IMMUTABLE, tag = git SHA)
#   8. Deploy            — SSM Send-Command (keyless, no SSH)
#   9. DAST              — OWASP ZAP Baseline
#
# Auth: GitHub OIDC → AWS IAM role (no long-lived keys)
# Config: SSM Parameter Store (no Secrets Manager)
# Tag: git SHA only (never :latest — ECR repo is IMMUTABLE)
# =============================================================================

name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # allow manual triggers

# Required for OIDC + SARIF uploads
permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: '21'

jobs:
  # ===========================================================================
  # CI — Gates 1-7: scan, build, scan, push
  # ===========================================================================
  ci:
    name: "CI — Build, Scan, Push"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      # ---------------------------------------------------------------------
      # Setup
      # ---------------------------------------------------------------------

      - name: Checkout source (full history for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: meta
        run: |
          # IMMUTABLE ECR: tag MUST be unique per commit. Use the git SHA.
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # Gate 1 — Secret Scan (Gitleaks)
      # =====================================================================

      - name: "Gate 1 — Secret Scan (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      # =====================================================================
      # Gate 2 — Lint (Checkstyle)
      # =====================================================================

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Gate 2 — Lint (Checkstyle)"
        run: mvn -B checkstyle:check

      # =====================================================================
      # Gate 3 — SAST (Semgrep)
      # =====================================================================

      - name: "Gate 3 — SAST (Semgrep)"
        run: |
          pip install --quiet "semgrep==1.178.0"

          # Human-readable output in the log
          echo "===== Semgrep findings ====="
          semgrep scan \
            --config p/java \
            --config p/secrets \
            --config p/dockerfile \
            --text --no-error || true

          # Blocking scan
          echo "===== Semgrep scan (enforcing) ====="
          semgrep scan \
            --config p/java \
            --config p/secrets \
            --config p/dockerfile \
            --sarif --output semgrep.sarif \
            --error

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

      # =====================================================================
      # Gate 4 — SCA (OWASP Dependency Check) with cache
      # =====================================================================

      - name: Cache OWASP Dependency Check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: owasp-dc-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-dc-${{ runner.os }}-

      - name: "Gate 4 — SCA (OWASP Dependency Check)"
        env:
          # Optional: add NVD_API_KEY as a GitHub Secret to cut first run
          # from ~30 min to ~2 min. Get one free at:
          # https://nvd.nist.gov/developers/request-an-api-key
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p ~/.cache/dependency-check
          mvn -B org.owasp:dependency-check-maven:check \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check \
            -DdataDirectory="$HOME/.cache/dependency-check" \
            -DnvdApiKey="$NVD_API_KEY" \
            -DfailOnError=false
        # failOnError=false → report is generated even when CVEs exist.
        # The report is the artifact; blocking rules are set on CVSS in pom.xml.
        continue-on-error: true

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check/*.html

      # =====================================================================
      # Gate 5 — Build (Maven)
      # =====================================================================

      - name: "Gate 5 — Build (Maven)"
        run: mvn -B clean package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # =====================================================================
      # AWS OIDC login (keyless)
      # =====================================================================

      - name: Debug OIDC token
        run: |
          curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

          echo "===== Role ARN we will assume ====="
          echo "${{ secrets.AWS_ROLE_ARN }}"

      - name: Verify AWS_ROLE_ARN secret matches expected value
        run: |
          echo -n "${{ secrets.AWS_ROLE_ARN }}" | sha256sum
          echo -n "arn:aws:iam::173331852212:role/devsecops-bankapp-GitHubActionsRole" | sha256sum

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =====================================================================
      # Gate 6 — Container Build
      # =====================================================================

      - name: "Gate 6 — Build container image"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      # =====================================================================
      # Gate 7 — Container Scan (Trivy) + Push to ECR
      # =====================================================================

      - name: "Gate 7 — Container Scan (Trivy)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: "Gate 7 — Push image to ECR"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ===========================================================================
  # CD — Gate 8: Deploy via SSM Send-Command (keyless)
  # ===========================================================================
  deploy:
    name: "CD — Deploy to EC2 via SSM"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Gate 8 — Deploy via SSM Send-Command"
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.ci.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          # Build a here-doc script that runs ON the instance.
          # Every $VAR is escaped with \$ so the EC2 shell expands it,
          # not this GitHub runner shell.
          SCRIPT=$(cat <<'EOSCRIPT'
          set -euo pipefail
          cd /opt/bankapp

          echo "[deploy] Logging into ECR..."
          aws ecr get-login-password --region __REGION__ \
            | docker login --username AWS --password-stdin __REGISTRY__

          echo "[deploy] Updating IMAGE_TAG to __TAG__"
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=__TAG__|" .env

          echo "[deploy] Pulling bankapp:__TAG__"
          docker compose pull bankapp

          echo "[deploy] Restarting bankapp"
          docker compose up -d bankapp

          echo "[deploy] Pruning unused images"
          docker image prune -f

          echo "[deploy] Current status:"
          docker compose ps
          EOSCRIPT
          )

          # Substitute placeholders safely (avoids shell-quoting surprises)
          SCRIPT="${SCRIPT//__REGION__/$AWS_REGION}"
          SCRIPT="${SCRIPT//__REGISTRY__/$ECR_REGISTRY}"
          SCRIPT="${SCRIPT//__TAG__/$IMAGE_TAG}"

          echo "----- SSM command payload -----"
          echo "$SCRIPT"
          echo "-------------------------------"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters "commands=$(printf '%s' "$SCRIPT" | jq -Rs .)" \
            --comment "Deploy $IMAGE_TAG from GitHub Actions run $GITHUB_RUN_ID" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Wait for the command to finish (up to ~10 min)
          echo "[deploy] Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          echo "[deploy] Final status: $STATUS"
          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy failed with status: $STATUS"
            exit 1
          fi

  # ===========================================================================
  # Gate 9 — DAST (OWASP ZAP Baseline)
  # ===========================================================================
  dast:
    name: "Gate 9 — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [ci, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read
      issues: write       # ZAP files an issue with the report

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve EC2 public IP
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
                --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                --query 'Reservations[0].Instances[0].PublicIpAddress' \
                --output text)
          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Target: http://$IP:8080"

      - name: Wait for app to become healthy
        run: |
          IP="${{ steps.ec2.outputs.public_ip }}"
          for i in $(seq 1 30); do
            if curl -fsS "http://$IP:8080/actuator/health" >/dev/null; then
              echo "App is healthy after $((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::App did not become healthy in 5 minutes"
          exit 1

      - name: "Gate 9 — DAST Baseline Scan"
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ steps.ec2.outputs.public_ip }}:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: true
          issue_title: "OWASP ZAP Baseline — ${{ github.sha }}"
        continue-on-error: true   # advisory — doesn't fail the pipeline

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
