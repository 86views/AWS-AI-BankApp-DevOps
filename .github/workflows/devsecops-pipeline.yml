# =============================================================================
# DevSecOps Master Pipeline
# =============================================================================
# 9 sequential security gates before code reaches production:
#   1. Secret Scan       — Gitleaks
#   2. Lint              — Checkstyle
#   3. SAST              — Semgrep
#   4. SCA               — OWASP Dependency Check (cached)
#   5. Build             — Maven
#   6. Container Build   — Docker (+ Trivy scan before anything is pushed)
#   7. Container Scan    — Trivy, then Push to Amazon ECR (IMMUTABLE, tag = git SHA)
#   8. Deploy            — SSM Send-Command (keyless, no SSH)
#   9. DAST              — OWASP ZAP Baseline
#
# Auth: GitHub OIDC -> AWS IAM role (no long-lived keys)
# Config: SSM Parameter Store (no Secrets Manager)
# Tag: git SHA only (never :latest — ECR repo is IMMUTABLE)
# =============================================================================

name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # allow manual triggers

# Required for OIDC + SARIF uploads
permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: '21'

jobs:
  # ===========================================================================
  # CI — Gates 1-7: scan, build, scan, push
  # ===========================================================================
  ci:
    name: "CI — Build, Scan, Push"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      # ---------------------------------------------------------------------
      # Setup
      # ---------------------------------------------------------------------

      - name: Checkout source (full history for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: meta
        run: |
          # IMMUTABLE ECR: tag MUST be unique per commit. Use the git SHA.
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # Gate 1 — Secret Scan (Gitleaks)
      # =====================================================================

      - name: "Gate 1 — Secret Scan (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

      # =====================================================================
      # Gate 2 — Lint (Checkstyle)
      # =====================================================================

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: "Gate 2 — Lint (Checkstyle)"
        run: mvn -B checkstyle:check

      # =====================================================================
      # Gate 3 — SAST (Semgrep)
      # =====================================================================

      - name: "Gate 3 — SAST (Semgrep)"
        run: |
          pip install --quiet "semgrep==1.178.0"

          # Human-readable output in the log
          echo "===== Semgrep findings ====="
          semgrep scan \
            --config p/java \
            --config p/secrets \
            --config p/dockerfile \
            --text --no-error || true

          # Blocking scan
          echo "===== Semgrep scan (enforcing) ====="
          semgrep scan \
            --config p/java \
            --config p/secrets \
            --config p/dockerfile \
            --sarif --output semgrep.sarif \
            --error

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      # =====================================================================
      # Gate 4 — SCA (OWASP Dependency Check) with resilient NVD cache
      # =====================================================================
      # Cache is restored first and saved IMMEDIATELY after the scan
      # (if: always()), so the slow NVD download survives later failures
      # or cancelled runs. Add NVD_API_KEY as a repo secret to cut the first
      # download from 30+ min to a few minutes:
      #   https://nvd.nist.gov/developers/request-an-api-key
      # Bump the -v1 suffix in both keys to force a fresh download.

      - name: Restore NVD cache
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: owasp-dc-${{ runner.os }}-v1
          restore-keys: |
            owasp-dc-${{ runner.os }}-

      - name: "Gate 4 — SCA (OWASP Dependency Check)"
        timeout-minutes: 45
        # Report is the artifact; blocking rules (CVSS) are set in pom.xml.
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p ~/.cache/dependency-check
          mvn -B org.owasp:dependency-check-maven:check \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check \
            -DdataDirectory="$HOME/.cache/dependency-check" \
            -DnvdApiKey="$NVD_API_KEY" \
            -DfailOnError=false

      - name: Save NVD cache
        if: always() && steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: owasp-dc-${{ runner.os }}-v1

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check/*.html
          if-no-files-found: ignore

      # =====================================================================
      # Gate 5 — Build (Maven)
      # =====================================================================

      - name: "Gate 5 — Build (Maven)"
        run: mvn -B clean package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      # =====================================================================
      # AWS OIDC login (keyless) — UNCHANGED
      # =====================================================================

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =====================================================================
      # Gate 6 — Container Build
      # =====================================================================

      - name: "Gate 6 — Build container image"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      # =====================================================================
      # Gate 7 — Container Scan (Trivy) + Push to ECR
      # =====================================================================

      - name: "Gate 7 — Container Scan (Trivy)"
        timeout-minutes: 15
        env:
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          # Pull vulnerability DBs from the AWS public ECR mirror. Requires
          # docker login below — anonymous pulls get rate-limited.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        run: |
          set -euo pipefail

          # Install Trivy CLI from the official apt repo
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

          trivy --version

          # Authenticate to the public ECR mirror to raise the DB pull rate
          # limit above the anonymous quota (needs ecr-public:GetAuthorizationToken
          # on the GitHub Actions role — already added via Terraform)
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

          # Scan and fail on HIGH/CRITICAL (secrets already covered by Gitleaks)
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --no-progress \
            --timeout 10m \
            "$IMAGE_REF"

      - name: "Gate 7 — Push image to ECR"
        env:
          IMAGE_REF: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
        run: |
          docker push "$IMAGE_REF"
          echo "Pushed: $IMAGE_REF"

  # ===========================================================================
  # Gate 8 — Deploy via SSM Send-Command
  # ===========================================================================
  deploy:
    name: "Gate 8 — Deploy (SSM)"
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Gate 8 — Deploy via SSM Send-Command"
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.ci.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Validate required deployment inputs.
          : "${INSTANCE_ID:?EC2_INSTANCE_ID secret is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          : "${ECR_REGISTRY:?ECR registry output is required}"
          : "${ECR_REPOSITORY:?ECR_REPOSITORY secret is required}"

          echo "[deploy] Preparing SSM deployment..."
          echo "[deploy] Image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Construct a POSIX-compatible script for the EC2 instance.
          # Every command is on its own physical line. In particular,
          # do not use shell line continuations for the ECR login command.
          SCRIPT=$(cat <<'EOSCRIPT'
          set -eu
          cd /opt/bankapp

          echo "[deploy] Checking deployment prerequisites..."
          command -v aws
          command -v docker
          docker compose version
          test -f .env

          echo "[deploy] Logging into ECR..."
          aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__

          echo "[deploy] Updating IMAGE_TAG..."
          sed -i 's|^IMAGE_TAG=.*|IMAGE_TAG=__TAG__|' .env

          echo "[deploy] Pulling image..."
          docker compose pull bankapp

          echo "[deploy] Restarting bankapp..."
          docker compose up -d bankapp

          echo "[deploy] Current status:"
          docker compose ps
          EOSCRIPT
          )

          # Replace placeholders with validated deployment values.
          SCRIPT="${SCRIPT//__REGION__/${AWS_REGION}}"
          SCRIPT="${SCRIPT//__REGISTRY__/${ECR_REGISTRY}}"
          SCRIPT="${SCRIPT//__TAG__/${IMAGE_TAG}}"

          # Verify the generated script has no unresolved placeholders.
          if grep -Eq '__REGION__|__REGISTRY__|__TAG__' <<< "$SCRIPT"; then
            echo "::error::Unresolved deployment placeholders."
            exit 1
          fi

          # Build valid JSON. jq splits the script at actual newline
          # characters so SSM receives a proper commands array.
          PARAMS_FILE=$(mktemp)
          trap 'rm -f "$PARAMS_FILE"' EXIT

          jq -n --arg script "$SCRIPT" \
            '{commands: ($script | split("\n"))}' > "$PARAMS_FILE"

          # Validate the payload before sending anything to EC2.
          jq -e '
            (.commands | type == "array") and
            (.commands | length > 1) and
            (.commands[0] == "set -eu")
          ' "$PARAMS_FILE" > /dev/null

          echo "[deploy] SSM payload validated."

          # Send the deployment command to the specified EC2 instance.
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${INSTANCE_ID}" \
            --parameters "file://${PARAMS_FILE}" \
            --comment "Deploy ${IMAGE_TAG} from GitHub Actions run ${GITHUB_RUN_ID}" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::SSM did not return a command ID."
            exit 1
          fi

          echo "[deploy] Command ID: ${COMMAND_ID}"
          echo "[deploy] Waiting for SSM execution..."

          # The waiter can return nonzero for a failed SSM command.
          # Retrieve the invocation details below in either case.
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "[deploy] SSM waiter completed."
          else
            echo "[deploy] SSM waiter returned nonzero; retrieving final status."
          fi

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "[deploy] Final status: ${STATUS}"

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true

          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text || true

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::SSM deployment failed with status: ${STATUS}"
            exit 1
          fi

          echo "[deploy] SSM deployment commands completed successfully."

  # ===========================================================================
  # Gate 9 — DAST (OWASP ZAP Baseline)
  # ===========================================================================
  dast:
    name: "Gate 9 — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [ci, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read
      issues: write       # ZAP files an issue with the report

    steps:
      # AWS OIDC login — UNCHANGED
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve EC2 public IP
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
                --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                --query 'Reservations[0].Instances[0].PublicIpAddress' \
                --output text)
          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Target: http://$IP:8080"

      - name: Wait for app to become healthy
        run: |
          IP="${{ steps.ec2.outputs.public_ip }}"
          for i in $(seq 1 30); do
            if curl -fsS "http://$IP:8080/actuator/health" >/dev/null; then
              echo "App is healthy after $((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::App did not become healthy in 5 minutes"
          exit 1

      - name: "Gate 9 — DAST Baseline Scan"
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ steps.ec2.outputs.public_ip }}:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: true
          issue_title: "OWASP ZAP Baseline — ${{ github.sha }}"
        continue-on-error: true   # advisory — doesn't fail the pipeline

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          if-no-files-found: ignore
